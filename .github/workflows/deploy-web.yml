# Builds the web app and publishes it to GitHub Pages on every push to main.
#
# One-time setup (see README → Deployment):
#   - Settings → Pages → Source: "GitHub Actions"
#   - Settings → Secrets and variables → Actions → Variables:
#       VITE_API_URL = https://<your-render-service>.onrender.com/api/v1
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Fail early if the API URL is not configured
        run: |
          if [ -z "${{ vars.VITE_API_URL }}" ]; then
            echo "::error::Set the repository variable VITE_API_URL (Settings → Secrets and variables → Actions → Variables)."
            exit 1
          fi

      - name: Build
        run: npm run build --workspace @baby-tracker/shared && npm run build:web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # GitHub Pages has no SPA rewrites: a reload on /baby-tracker/timeline would
      # 404. Serving the app as the 404 page lets React Router take over.
      - name: SPA fallback
        run: cp apps/web/dist/index.html apps/web/dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
