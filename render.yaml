# Render Blueprint for the API (Render → New → Blueprint → this repository).
# The web app is on GitHub Pages; see README → Deployment.
services:
  - type: web
    name: baby-tracker-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build --workspace @baby-tracker/shared && npm run build:api
    startCommand: npm run start --workspace @baby-tracker/api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.23.2
      # MongoDB Atlas connection string — entered in the Render dashboard, never committed.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The GitHub Pages origin: scheme + host only, no path, no trailing slash.
      - key: CORS_ORIGIN
        value: https://soltonanna.github.io
      # Web app and API are on different sites, so the refresh cookie must be
      # SameSite=None; Secure. The origin guard on /auth/refresh and /auth/logout
      # is the CSRF protection that makes this safe (docs/phase-1a-auth.md §8).
      - key: COOKIE_SAMESITE
        value: none
      - key: COOKIE_SECURE
        value: 'true'
      - key: TRUST_PROXY
        value: '1'
